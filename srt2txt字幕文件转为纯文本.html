<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subtitle to Text Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0a;
    --surface: #161614;
    --surface-raised: #1e1e1b;
    --surface-hover: #262622;
    --border: #2a2a26;
    --border-focus: #c8a23a;
    --accent: #d4a843;
    --accent-dim: #a07d2e;
    --accent-glow: rgba(212, 168, 67, 0.12);
    --text-primary: #ece8df;
    --text-secondary: #9a9590;
    --text-muted: #5e5a55;
    --danger: #c45c4a;
    --success: #5aab6e;
    --radius: 10px;
    --radius-lg: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', 'DM Mono', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 15% 20%, rgba(212, 168, 67, 0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 80%, rgba(212, 168, 67, 0.03) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 60px 24px 100px;
  }

  /* ─── Header ─── */
  header {
    margin-bottom: 56px;
  }

  .logo-mark {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  .logo-mark .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  h1 {
    font-family: 'Instrument Serif', 'Noto Sans SC', serif;
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    font-weight: 400;
    line-height: 1.15;
    color: var(--text-primary);
    margin-bottom: 14px;
  }

  h1 em {
    font-style: italic;
    color: var(--accent);
  }

  .subtitle {
    font-size: 15px;
    color: var(--text-secondary);
    line-height: 1.7;
    max-width: 520px;
    font-weight: 300;
  }

  /* ─── Formats badge row ─── */
  .format-badges {
    display: flex;
    gap: 8px;
    margin-top: 24px;
    flex-wrap: wrap;
  }

  .format-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border: 1px solid var(--border);
    border-radius: 100px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
    background: var(--surface);
    transition: all 0.25s ease;
  }

  .format-badge .ext {
    color: var(--accent);
    font-weight: 500;
  }

  /* ─── Drop Zone ─── */
  .drop-zone {
    position: relative;
    border: 1.5px dashed var(--border);
    border-radius: var(--radius-lg);
    padding: 56px 32px;
    text-align: center;
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    background: var(--surface);
    overflow: hidden;
  }

  .drop-zone::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--accent-glow);
    opacity: 0;
    transition: opacity 0.35s ease;
  }

  .drop-zone:hover,
  .drop-zone.drag-over {
    border-color: var(--accent-dim);
    background: var(--surface-raised);
  }

  .drop-zone:hover::before,
  .drop-zone.drag-over::before {
    opacity: 1;
  }

  .drop-zone.drag-over {
    border-color: var(--accent);
    transform: scale(1.005);
  }

  .drop-icon {
    position: relative;
    width: 56px;
    height: 56px;
    margin: 0 auto 20px;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
  }

  .drop-zone:hover .drop-icon {
    border-color: var(--accent-dim);
    transform: translateY(-2px);
  }

  .drop-icon svg {
    width: 24px;
    height: 24px;
    stroke: var(--text-secondary);
    transition: stroke 0.3s ease;
  }

  .drop-zone:hover .drop-icon svg {
    stroke: var(--accent);
  }

  .drop-text {
    position: relative;
    font-size: 15px;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  .drop-text strong {
    color: var(--accent);
    font-weight: 500;
    cursor: pointer;
  }

  .drop-hint {
    position: relative;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 10px;
    letter-spacing: 0.04em;
  }

  #fileInput { display: none; }

  /* ─── File List ─── */
  .file-list {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .file-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .file-icon {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--accent-glow);
    border: 1px solid rgba(212, 168, 67, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.05em;
  }

  .file-info {
    flex: 1;
    min-width: 0;
  }

  .file-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .file-meta {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 3px;
  }

  .file-remove {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }

  .file-remove:hover {
    border-color: var(--danger);
    color: var(--danger);
    background: rgba(196, 92, 74, 0.08);
  }

  .file-remove svg { width: 14px; height: 14px; }

  /* ─── Options ─── */
  .options-panel {
    margin-top: 28px;
    padding: 22px 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: none;
  }

  .options-panel.visible {
    display: block;
    animation: slideIn 0.3s ease;
  }

  .options-title {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  .option-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
  }

  .option-row + .option-row {
    border-top: 1px solid var(--border);
  }

  .toggle {
    position: relative;
    width: 38px;
    height: 22px;
    flex-shrink: 0;
  }

  .toggle input { display: none; }

  .toggle-track {
    position: absolute;
    inset: 0;
    background: var(--surface-hover);
    border: 1px solid var(--border);
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .toggle-track::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .toggle input:checked + .toggle-track {
    background: var(--accent-glow);
    border-color: var(--accent-dim);
  }

  .toggle input:checked + .toggle-track::after {
    left: 19px;
    background: var(--accent);
  }

  .option-label {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.4;
  }

  .option-label small {
    display: block;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
    font-family: 'DM Mono', monospace;
  }

  /* ─── Action Bar ─── */
  .action-bar {
    margin-top: 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 28px;
    border: none;
    border-radius: var(--radius);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    white-space: nowrap;
  }

  .btn svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  .btn-primary {
    background: var(--accent);
    color: var(--bg);
  }

  .btn-primary:hover {
    background: #ddb54e;
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(212, 168, 67, 0.2);
  }

  .btn-primary:active {
    transform: translateY(0);
  }

  .btn-secondary {
    background: var(--surface);
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    background: var(--surface-raised);
    color: var(--text-primary);
    border-color: var(--text-muted);
  }

  .btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none !important;
    box-shadow: none !important;
  }

  /* ─── Preview ─── */
  .preview-section {
    margin-top: 40px;
    display: none;
  }

  .preview-section.visible {
    display: block;
    animation: slideIn 0.4s ease;
  }

  .preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .preview-title {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .preview-stats {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  .preview-stats span {
    color: var(--accent);
  }

  .preview-box {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    max-height: 420px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .preview-box::-webkit-scrollbar {
    width: 6px;
  }

  .preview-box::-webkit-scrollbar-track {
    background: transparent;
  }

  .preview-box::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }

  .preview-content {
    padding: 22px 24px;
    font-size: 14px;
    line-height: 1.9;
    color: var(--text-secondary);
    white-space: pre-wrap;
    word-break: break-all;
    font-family: 'Noto Sans SC', 'DM Mono', sans-serif;
  }

  /* ─── Toast ─── */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    padding: 12px 24px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 13px;
    color: var(--text-primary);
    opacity: 0;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 100;
    pointer-events: none;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .toast.success { border-color: var(--success); }
  .toast.error { border-color: var(--danger); }

  /* ─── Responsive ─── */
  @media (max-width: 600px) {
    .app { padding: 40px 16px 80px; }
    .drop-zone { padding: 40px 20px; }
    .action-bar { flex-direction: column; }
    .btn { justify-content: center; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="logo-mark">
      <span class="dot"></span>
      Subtitle Converter
    </div>
    <h1>字幕文件<br>转为<em>纯文本</em></h1>
    <p class="subtitle">将 SRT、ASS、SSA、VTT 等字幕格式中的对白内容提取为干净的纯文本文件，去除时间轴与格式标签。</p>
    <div class="format-badges">
      <span class="format-badge"><span class="ext">.srt</span> SubRip</span>
      <span class="format-badge"><span class="ext">.ass</span> Advanced SSA</span>
      <span class="format-badge"><span class="ext">.ssa</span> Sub Station Alpha</span>
      <span class="format-badge"><span class="ext">.vtt</span> WebVTT</span>
    </div>
  </header>

  <!-- Drop Zone -->
  <div class="drop-zone" id="dropZone">
    <div class="drop-icon">
      <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
      </svg>
    </div>
    <p class="drop-text">拖放字幕文件至此处，或 <strong>点击选择文件</strong></p>
    <p class="drop-hint">支持同时选择多个文件</p>
    <input type="file" id="fileInput" multiple accept=".srt,.ass,.ssa,.vtt,.sub">
  </div>

  <!-- File List -->
  <div class="file-list" id="fileList"></div>

  <!-- Options -->
  <div class="options-panel" id="optionsPanel">
    <div class="options-title">Output Options</div>
    <div class="option-row">
      <label class="toggle">
        <input type="checkbox" id="optRemoveEmpty" checked>
        <span class="toggle-track"></span>
      </label>
      <span class="option-label">
        去除空行
        <small>移除输出文本中的连续空行</small>
      </span>
    </div>
    <div class="option-row">
      <label class="toggle">
        <input type="checkbox" id="optRemoveDuplicate">
        <span class="toggle-track"></span>
      </label>
      <span class="option-label">
        去除重复行
        <small>去除因字幕重叠产生的重复对白</small>
      </span>
    </div>
  </div>

  <!-- Actions -->
  <div class="action-bar" id="actionBar" style="display: none;">
    <button class="btn btn-primary" id="btnConvert">
      <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/>
      </svg>
      转换并下载
    </button>
    <button class="btn btn-secondary" id="btnClear">
      清空文件
    </button>
  </div>

  <!-- Preview -->
  <div class="preview-section" id="previewSection">
    <div class="preview-header">
      <span class="preview-title">Preview</span>
      <span class="preview-stats" id="previewStats"></span>
    </div>
    <div class="preview-box">
      <div class="preview-content" id="previewContent"></div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(function() {
  'use strict';

  const $ = id => document.getElementById(id);
  const dropZone = $('dropZone');
  const fileInput = $('fileInput');
  const fileList = $('fileList');
  const optionsPanel = $('optionsPanel');
  const actionBar = $('actionBar');
  const btnConvert = $('btnConvert');
  const btnClear = $('btnClear');
  const previewSection = $('previewSection');
  const previewContent = $('previewContent');
  const previewStats = $('previewStats');
  const toast = $('toast');

  let files = [];
  let convertedResults = [];

  // ─── Toast ───
  function showToast(msg, type = '') {
    toast.textContent = msg;
    toast.className = 'toast show ' + type;
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.className = 'toast', 2600);
  }

  // ─── Format bytes ───
  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
  }

  // ─── Detect format ───
  function detectFormat(name) {
    const ext = name.split('.').pop().toLowerCase();
    return ext;
  }

  // ─── Parse SRT ───
  function parseSRT(text) {
    const lines = [];
    const blocks = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split(/\n\n+/);

    for (const block of blocks) {
      const blockLines = block.trim().split('\n');
      if (blockLines.length < 2) continue;

      // Find the timestamp line
      let tsIdx = -1;
      for (let i = 0; i < blockLines.length; i++) {
        if (blockLines[i].includes('-->')) {
          tsIdx = i;
          break;
        }
      }
      if (tsIdx === -1 || tsIdx + 1 >= blockLines.length) continue;

      // Text lines are after timestamp
      for (let i = tsIdx + 1; i < blockLines.length; i++) {
        let line = blockLines[i].trim();
        if (!line) continue;
        // Remove HTML tags
        line = line.replace(/<[^>]+>/g, '');
        // Remove SSA-style tags that might appear in SRT
        line = line.replace(/\{[^}]*\}/g, '');
        line = line.trim();
        if (line) lines.push(line);
      }
    }
    return lines;
  }

  // ─── Parse ASS/SSA ───
  function parseASS(text) {
    const lines = [];
    const normalized = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    const allLines = normalized.split('\n');

    let inEvents = false;
    let formatFields = [];
    let textIndex = -1;

    for (const line of allLines) {
      const trimmed = line.trim();

      if (trimmed.toLowerCase() === '[events]') {
        inEvents = true;
        continue;
      }

      if (trimmed.startsWith('[') && trimmed.endsWith(']') && trimmed !== '[Events]') {
        inEvents = false;
        continue;
      }

      if (!inEvents) continue;

      if (trimmed.toLowerCase().startsWith('format:')) {
        formatFields = trimmed.substring(7).split(',').map(s => s.trim().toLowerCase());
        textIndex = formatFields.indexOf('text');
        continue;
      }

      if (trimmed.toLowerCase().startsWith('dialogue:') || trimmed.toLowerCase().startsWith('comment:')) {
        if (trimmed.toLowerCase().startsWith('comment:')) continue;

        let content = trimmed.substring(trimmed.indexOf(':') + 1).trim();

        if (textIndex >= 0) {
          const parts = content.split(',');
          // The Text field is the last one (after textIndex), join remaining parts
          if (parts.length > textIndex) {
            content = parts.slice(textIndex).join(',').trim();
          }
        }

        // Remove override tags like {\b1}, {\pos(x,y)}, etc.
        content = content.replace(/\{[^}]*\}/g, '');
        // Remove \N and \n (line breaks in ASS)
        content = content.replace(/\\N/g, ' ').replace(/\\n/g, ' ');
        content = content.trim();

        if (content) lines.push(content);
      }
    }
    return lines;
  }

  // ─── Parse VTT ───
  function parseVTT(text) {
    const lines = [];
    const normalized = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

    // Remove WEBVTT header
    const content = normalized.replace(/^WEBVTT[^\n]*\n/, '');
    const blocks = content.split(/\n\n+/);

    for (const block of blocks) {
      const blockLines = block.trim().split('\n');
      if (blockLines.length < 1) continue;

      let startIdx = 0;
      // Skip cue identifier if present
      for (let i = 0; i < blockLines.length; i++) {
        if (blockLines[i].includes('-->')) {
          startIdx = i + 1;
          break;
        }
      }

      if (startIdx === 0 && !blockLines[0].includes('-->')) continue;
      if (startIdx === 0) startIdx = 1;

      for (let i = startIdx; i < blockLines.length; i++) {
        let line = blockLines[i].trim();
        if (!line) continue;
        // Remove VTT tags
        line = line.replace(/<[^>]+>/g, '');
        line = line.trim();
        if (line) lines.push(line);
      }
    }
    return lines;
  }

  // ─── Parse file ───
  function parseFile(text, format) {
    switch (format) {
      case 'srt': return parseSRT(text);
      case 'ass':
      case 'ssa': return parseASS(text);
      case 'vtt': return parseVTT(text);
      default: return parseSRT(text); // fallback
    }
  }

  // ─── Post-process ───
  function postProcess(lines) {
    const removeEmpty = $('optRemoveEmpty').checked;
    const removeDup = $('optRemoveDuplicate').checked;

    let result = lines;

    if (removeDup) {
      const seen = new Set();
      result = result.filter(l => {
        const key = l.toLowerCase();
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    let text = result.join('\n');

    if (removeEmpty) {
      text = text.replace(/\n{3,}/g, '\n\n');
    }

    return text.trim();
  }

  // ─── Add files ───
  function addFiles(fileArray) {
    const validExts = ['srt', 'ass', 'ssa', 'vtt', 'sub'];
    let added = 0;

    for (const f of fileArray) {
      const ext = detectFormat(f.name);
      if (!validExts.includes(ext)) {
        showToast(`不支持的格式: .${ext}`, 'error');
        continue;
      }
      // Check duplicate
      if (files.some(existing => existing.name === f.name && existing.size === f.size)) {
        continue;
      }
      files.push(f);
      added++;
    }

    if (added > 0) {
      showToast(`已添加 ${added} 个文件`, 'success');
    }

    renderFileList();
    updateUI();
  }

  // ─── Remove file ───
  function removeFile(index) {
    files.splice(index, 1);
    renderFileList();
    updateUI();
  }

  // ─── Render file list ───
  function renderFileList() {
    fileList.innerHTML = '';
    files.forEach((f, i) => {
      const ext = detectFormat(f.name).toUpperCase();
      const item = document.createElement('div');
      item.className = 'file-item';
      item.innerHTML = `
        <div class="file-icon">${ext}</div>
        <div class="file-info">
          <div class="file-name">${escapeHtml(f.name)}</div>
          <div class="file-meta">${formatSize(f.size)}</div>
        </div>
        <button class="file-remove" data-idx="${i}" title="移除">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      `;
      fileList.appendChild(item);
    });

    // Bind remove
    fileList.querySelectorAll('.file-remove').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        removeFile(parseInt(btn.dataset.idx));
      });
    });
  }

  // ─── Update UI visibility ───
  function updateUI() {
    const hasFiles = files.length > 0;
    optionsPanel.classList.toggle('visible', hasFiles);
    actionBar.style.display = hasFiles ? 'flex' : 'none';
    if (!hasFiles) {
      previewSection.classList.remove('visible');
      convertedResults = [];
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ─── Convert ───
  async function convert() {
    if (files.length === 0) return;

    btnConvert.disabled = true;
    convertedResults = [];
    let totalChars = 0;
    let allPreviewText = '';

    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      try {
        const text = await readFileAsText(f);
        const format = detectFormat(f.name);
        const lines = parseFile(text, format);

        if (lines.length === 0) {
          showToast(`${f.name}: 未提取到文本内容`, 'error');
          continue;
        }

        const processed = postProcess(lines);
        totalChars += processed.length;

        const baseName = f.name.replace(/\.[^.]+$/, '') + '.txt';
        convertedResults.push({ name: baseName, content: processed });

        if (files.length === 1) {
          allPreviewText = processed;
        } else {
          allPreviewText += `── ${baseName} ──\n\n${processed}\n\n`;
        }
      } catch (err) {
        showToast(`解析 ${f.name} 失败`, 'error');
      }
    }

    if (convertedResults.length > 0) {
      // Show preview
      previewSection.classList.add('visible');
      previewContent.textContent = allPreviewText;
      previewStats.innerHTML = `<span>${convertedResults.length}</span> 个文件 · <span>${totalChars.toLocaleString()}</span> 字符`;

      // Auto download
      if (convertedResults.length === 1) {
        downloadFile(convertedResults[0].name, convertedResults[0].content);
        showToast(`转换完成，已开始下载`, 'success');
      } else {
        // Multiple files - download each
        convertedResults.forEach((r, i) => {
          setTimeout(() => downloadFile(r.name, r.content), i * 300);
        });
        showToast(`转换完成，${convertedResults.length} 个文件已开始下载`, 'success');
      }
    }

    btnConvert.disabled = false;
  }

  // ─── Read file ───
  function readFileAsText(file) {
    return new Promise((resolve, reject) => {
      // Try UTF-8 first, fallback to GBK for Chinese subtitles
      const reader = new FileReader();
      reader.onload = () => {
        const result = reader.result;
        // Check for garbled characters (mojibake detection)
        if (result.includes('\uFFFD') || hasGarbledText(result)) {
          // Try GBK
          const reader2 = new FileReader();
          reader2.onload = () => resolve(reader2.result);
          reader2.onerror = () => resolve(result); // fallback to original
          reader2.readAsText(file, 'GBK');
        } else {
          resolve(result);
        }
      };
      reader.onerror = reject;
      reader.readAsText(file, 'UTF-8');
    });
  }

  function hasGarbledText(text) {
    // Simple heuristic: if there's a high ratio of replacement chars or common mojibake patterns
    const sample = text.substring(0, 500);
    let garbled = 0;
    for (let i = 0; i < sample.length; i++) {
      const code = sample.charCodeAt(i);
      if (code === 0xFFFD || (code >= 0xF000 && code <= 0xFFFF)) garbled++;
    }
    return garbled / sample.length > 0.05;
  }

  // ─── Download ───
  function downloadFile(name, content) {
    const BOM = '\uFEFF';
    const blob = new Blob([BOM + content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  // ─── Event: Drop Zone ───
  dropZone.addEventListener('click', () => fileInput.click());

  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    e.stopPropagation();
    dropZone.classList.add('drag-over');
  });

  dropZone.addEventListener('dragleave', e => {
    e.preventDefault();
    e.stopPropagation();
    dropZone.classList.remove('drag-over');
  });

  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    e.stopPropagation();
    dropZone.classList.remove('drag-over');
    const dropped = Array.from(e.dataTransfer.files);
    addFiles(dropped);
  });

  fileInput.addEventListener('change', () => {
    addFiles(Array.from(fileInput.files));
    fileInput.value = '';
  });

  // ─── Event: Buttons ───
  btnConvert.addEventListener('click', convert);

  btnClear.addEventListener('click', () => {
    files = [];
    convertedResults = [];
    renderFileList();
    updateUI();
    showToast('已清空所有文件');
  });

  // ─── Prevent default drag on body ───
  document.body.addEventListener('dragover', e => e.preventDefault());
  document.body.addEventListener('drop', e => e.preventDefault());

})();
</script>
</body>
</html>
